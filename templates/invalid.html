<!DOCTYPE html>
<html>
<head>
    <title>Document Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            margin: 40px;
        }

        .container {
            border: 1px solid black;
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        .verification {
            border: 1px solid black;
            padding: 30px;
            text-align: center; 
            margin-top: 20px;
        }

        .invalid {
            font-size: 26px;
            font-weight: bold;
        }

        .message {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 style="text-align:center;">
        DIGITAL VERIFICATION
    </h1>

    <div class="verification">

        <div class="invalid">
            ❌ INVALID DOCUMENT
        </div>

        <p class="message">
            This document could not be verified.
        </p>

        <p>
            The document ID is not registered in the verification system.
        </p>

    </div>

</div>

</body>
</html>
